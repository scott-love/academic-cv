name: Export Website Publications

on:
  workflow_dispatch:

jobs:
  export-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout academic-cv
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyyaml

      - name: Run publication exporter
        run: |
          python scripts/generate_hugo_content.py

      - name: Debug exported files
        run: |
          echo "Repo root:"
          pwd
          echo "Top-level dirs:"
          find . -maxdepth 2 -type d | sort
          echo "Looking for publication dirs/files:"
          find . -type d -name "publication" | sort
          find . -type d -name "hal-*" | sort
          find . -type f -name "index.md" | grep -E "publication|hal-" || true

      - name: Generate publication artifact manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          pub_root = Path("content/en/publication")
          hal_dirs = sorted([p for p in pub_root.glob("hal-*") if p.is_dir()])
          hal_ids = [p.name for p in hal_dirs]

          manifest = {
              "schema_version": "1",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_repo": os.getenv("GITHUB_REPOSITORY"),
              "source_commit_sha": os.getenv("GITHUB_SHA"),
              "publication_dir": str(pub_root),
              "publication_count": len(hal_ids),
              "hal_ids": hal_ids,
          }

          out = Path("publication-artifact-manifest.json")
          out.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {out} with {len(hal_ids)} publications")
          PY