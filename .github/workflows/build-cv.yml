name: Build CV

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'cv/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'cv/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install uv
      run: |
        pip install uv
    
    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-fonts-extra
    
    - name: Install Python dependencies
      run: |
        uv sync
    
    - name: Fetch publications from HAL
      run: |
        uv run python scripts/fetch_hal.py
    
    - name: Generate LaTeX CV
      run: |
        uv run python scripts/generate_cv_latex.py
    
    - name: Compile LaTeX to PDF
      run: |
        cd cv
        pdflatex -interaction=nonstopmode -halt-on-error -output-directory=. cv.tex
        pdflatex -interaction=nonstopmode -halt-on-error -output-directory=. cv.tex
        cd ..

    - name: Commit refreshed publications cache
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        if git diff --quiet -- data/publications.json; then
          echo "No publication cache changes to commit."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/publications.json
        git commit -m "Refresh publications cache"
        git push origin "HEAD:${BRANCH_NAME}"
     
    - name: Upload CV artifact
      uses: actions/upload-artifact@v4
      with:
        name: cv
        path: cv/cv.pdf
        retention-days: 2

    - name: Upload LaTeX log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cv-log
        path: cv/cv.log
        retention-days: 10

  release:
    # Run on successful non-PR builds (main push or manual dispatch)
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository (full history for tags)
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}

    - name: Download CV artifact
      uses: actions/download-artifact@v4
      with:
        name: cv
        path: cv

    - name: Compute next date tag
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        DATE_TAG="$(date -u +%Y-%m-%d)"
        git fetch --tags --force

        if git rev-parse -q --verify "refs/tags/${DATE_TAG}" >/dev/null; then
          n=1
          while git rev-parse -q --verify "refs/tags/${DATE_TAG}.${n}" >/dev/null; do
            n=$((n+1))
          done
          FINAL_TAG="${DATE_TAG}.${n}"
        else
          FINAL_TAG="${DATE_TAG}"
        fi

        echo "tag=${FINAL_TAG}" >> "$GITHUB_OUTPUT"

    - name: Create and push tag
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag "${TAG}"
        git push origin "refs/tags/${TAG}"

    - name: Create GitHub Release and upload CV asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: CV ${{ steps.tag.outputs.tag }}
        files: cv/cv.pdf
        generate_release_notes: true
