name: Build CV

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        run: uv sync

      - name: Fetch HAL
        run: uv run python scripts/fetch_hal.py

      - name: Render CV
        run: quarto render cv/cv.qmd

      - name: Upload CV
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: |
            cv/*.html
            cv/*.pdf